<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6366f1">
<title>英単語バトル｜対戦・戦績・統計</title>
<style>
:root{
  --indigo:#6366f1; --violet:#8b5cf6; --pink:#ec4899; --rose:#f43f5e;
  --ink:#1e293b; --sub:#64748b; --line:#e2e8f0; --card:#ffffff;
  --ok:#10b981; --ng:#ef4444; --warn:#f59e0b;
  --r:16px; --shadow:0 6px 24px rgba(51,65,85,.09);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#eef2ff 0%,#fdf2f8 55%,#fff7ed 100%);min-height:100vh}
button{font-family:inherit}
h1,h2,h3,h4{margin:0}
/* ---------- header ---------- */
#topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--indigo),var(--violet) 55%,var(--pink));color:#fff;
  box-shadow:0 4px 18px rgba(99,102,241,.35)}
.topin{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.topin .ttl{font-weight:800;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.topin .ttl small{font-weight:600;opacity:.75;font-size:11px}
.tspace{flex:1}
.who{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:4px 8px 4px 5px;border-radius:99px;font-size:13px;font-weight:700}
.sig{display:inline-flex;align-items:flex-end;gap:2.5px;background:rgba(0,0,0,.22);border-radius:8px;padding:6px 7px;cursor:default;flex:none}
.sig i{width:4.5px;border-radius:2.5px;background:rgba(255,255,255,.30)}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:9px}.sig i:nth-child(3){height:12px}.sig i:nth-child(4){height:15px}
.sig i.on{background:#fff}
.sig.c i.on{animation:blink 1.1s infinite}
.sig.r i.on{background:#fbbf24;animation:blink .8s infinite}
.sig.off i{background:rgba(255,255,255,.22)}
@keyframes blink{50%{opacity:.35}}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.avatar.big{width:60px;height:60px;font-size:24px;margin:0 auto 8px}
#lockbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;width:34px;height:34px;font-size:15px;cursor:pointer}
#lockbtn:active{transform:scale(.94)}
/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14.5px;margin:14px 0 8px;color:var(--sub)}
.sub{color:var(--sub);font-size:13px;line-height:1.6}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px;line-height:1.8}
.foot button{background:none;border:0;color:#818cf8;cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
/* ---------- banner / notice ---------- */
.banner{background:#fff7ed;border:1.5px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:13px;font-weight:700;line-height:1.6}
#gbar{max-width:760px;margin:12px auto -2px;padding:0 14px}
#gbar .banner{margin-bottom:0}
.notice{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:10px 13px;font-size:12.5px;margin-bottom:13px;line-height:1.7}
.notice b{display:block;margin-bottom:2px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;
  font-size:15px;font-weight:800;cursor:pointer;background:#eef2ff;color:#4338ca;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.965)}
.btn.pri{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn.pk{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;box-shadow:0 4px 14px rgba(236,72,153,.35)}
.btn.ok{background:#d1fae5;color:#065f46}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px;font-weight:700}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- menu ---------- */
.mi{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink);transition:.13s}
.mi:hover{border-color:#c7d2fe}
.mi:active{transform:scale(.985)}
.mi .ic{font-size:23px;flex:none}
.mi .tx{flex:1;min-width:0}
.mi .tx small{display:block;color:var(--sub);font-weight:600;font-size:11.5px;margin-top:1px}
.mi .arr{color:#cbd5e1;font-weight:800}
.mi .cnt{background:var(--pink);color:#fff;border-radius:99px;font-size:11px;padding:2px 8px;font-weight:800}
/* ---------- forms ---------- */
label.f{display:block;font-size:12.5px;color:var(--sub);margin:13px 0 5px;font-weight:800}
input[type=text],input[type=password],input[type=search],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:11px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
textarea{font-size:12px;font-family:ui-monospace,monospace}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--indigo)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:66px;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--sub);font-size:13.5px}
.seg button.on{border-color:var(--indigo);background:#eef2ff;color:#4338ca}
.check{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:700}
.check input{width:18px;height:18px;accent-color:var(--indigo)}
.check .pinok{margin-left:auto}
/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:.01em}
.stat .v small{font-size:12px;color:var(--sub);font-weight:700}
.stat .k{font-size:11px;color:var(--sub);font-weight:700;margin-top:2px}
.stat.hi{background:linear-gradient(135deg,#eef2ff,#fdf2f8);border-color:#c7d2fe}
/* ---------- battle ---------- */
.qdir{text-align:center;color:var(--sub);font-size:12.5px;font-weight:800;letter-spacing:.04em}
.qword{font-size:31px;font-weight:800;text-align:center;padding:16px 6px 12px;letter-spacing:.02em;word-break:break-word}
.qcount{text-align:center;font-size:12px;color:#94a3b8;font-weight:800;margin-bottom:4px}
.timer{height:9px;border-radius:99px;background:#eef2f7;overflow:hidden;margin:12px 0 4px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#84cc16);border-radius:99px;transition:width .1s linear}
.timer i.hot{background:linear-gradient(90deg,#f59e0b,var(--ng))}
.tnum{text-align:center;font-size:12px;color:var(--sub);font-weight:800}
.choices{display:grid;gap:10px;margin-top:13px}
.choice{padding:14px 15px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink);transition:.12s}
.choice:active{transform:scale(.98)}
.choice.ok{border-color:var(--ok);background:#ecfdf5}
.choice.ng{border-color:var(--ng);background:#fef2f2}
.choice.dim{opacity:.5}
.pass{text-align:center;padding:26px 8px 10px}
.pass .vs{font-size:12px;color:#94a3b8;font-weight:800;letter-spacing:.1em;margin:10px 0}
.rk{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.rk .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#f1f5f9;color:var(--sub);flex:none}
.rk.r1 .no{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.rk.r2 .no{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rk.r3 .no{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff}
.rk .nm{font-weight:800;font-size:14.5px}
.rk .nm small{display:block;font-weight:600;color:var(--sub);font-size:11px}
.rk .pt{margin-left:auto;text-align:right}
.rk .pt b{font-size:17px}
.rk .pt small{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.rk.me{border-color:var(--indigo);background:#eef2ff}
.turnbar{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.turnbar .lbl{font-size:12px;color:var(--sub);font-weight:800}
/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--sub);font-weight:800;text-align:left;padding:8px 7px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:11.5px}
.tbl td{padding:8px 7px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}
/* ---------- badges / meter ---------- */
.badge{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.b-gold{background:#fef3c7;color:#92400e}.b-sil{background:#e2e8f0;color:#334155}.b-brz{background:#ffedd5;color:#9a3412}
.b-ok{background:#d1fae5;color:#065f46}.b-ng{background:#fee2e2;color:#991b1b}.b-info{background:#e0e7ff;color:#3730a3}
.b-warn{background:#fef3c7;color:#92400e}.b-mut{background:#f1f5f9;color:#475569}.b-pk{background:#fce7f3;color:#9d174d}
.meter{height:7px;background:#f1f5f9;border-radius:99px;overflow:hidden;min-width:56px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#ef4444)}
.meter.acc i{background:linear-gradient(90deg,#34d399,#10b981)}
/* ---------- weak word rows ---------- */
.wordrow{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;background:#fff}
.wr-top{display:flex;gap:10px;align-items:center}
.wr-main{flex:1;min-width:0;cursor:pointer}
.wr-e{font-weight:800;font-size:16px}
.wr-j{color:var(--sub);font-size:12.5px;margin-top:1px}
.wr-m{width:120px;flex:none;text-align:right}
.wr-m .sc{font-size:12px;font-weight:800;color:var(--ng)}
.wr-m .sc.low{color:var(--warn)}
.wr-m .cap{font-size:10px;color:#94a3b8;font-weight:700}
.wr-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:9px;font-size:12px;color:var(--sub)}
.hist .he{display:flex;gap:7px;padding:2.5px 0;font-variant-numeric:tabular-nums}
.hist .he b{font-weight:700;color:var(--ink)}
/* ---------- charts ---------- */
.chartbox svg{width:100%;height:auto;display:block}
.axis{font-size:10px;fill:#94a3b8}
.gline{stroke:#eef2f7;stroke-width:1}
.poly{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:#fff;stroke-width:1.5}
.bar{rx:3}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--sub);font-size:13px}
.tabs button.on{background:linear-gradient(135deg,var(--indigo),var(--violet));border-color:transparent;color:#fff}
/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@media(min-width:560px){.modal{align-items:center}}
.sheet{background:#fff;width:100%;max-width:580px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;animation:up .18s}
@media(min-width:560px){.sheet{border-radius:20px}}
.sheet h2{font-size:16.5px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 20px;border-radius:99px;
  font-size:13.5px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s;max-width:88vw;text-align:center}
/* ---------- misc ---------- */
.empty{text-align:center;color:var(--sub);padding:36px 12px;font-size:14px;line-height:1.8}
.empty .big{font-size:42px;display:block;margin-bottom:6px}
.klist{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.klist .badge{cursor:default}
.divh{border:0;border-top:1.5px solid var(--line);margin:14px 0}
.pinok{font-size:11px}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.pop{animation:up .18s}
@media(max-width:420px){
  .grid2{grid-template-columns:1fr 1fr}
  .qword{font-size:26px}
  .wr-m{width:96px}
}
/* ---------- チャット ---------- */
#chatFab{position:fixed;right:14px;bottom:14px;z-index:60;width:52px;height:52px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--indigo),var(--pink));color:#fff;font-size:21px;cursor:pointer;
  box-shadow:0 6px 18px rgba(30,20,80,.4);display:none;place-items:center}
#chatFab:active{transform:scale(.93)}
#chatFab .cbadge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:99px;min-width:20px;height:20px;
  font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#chatPanel{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,10,40,.45)}
#chatPanel .sheet{background:var(--card);width:100%;max-width:760px;max-height:74vh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chead b{font-size:15px}
#chatClose{border:0;background:rgba(0,0,0,.08);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;color:var(--ink)}
#chatLog{overflow-y:auto;flex:1;min-height:120px;padding:4px 2px;display:flex;flex-direction:column;gap:7px}
.cmsg{max-width:82%}
.cmsg small{display:block;color:var(--sub);font-size:10.5px;margin:0 2px 1px}
.cmsg .ctext{background:#f1f5f9;border-radius:4px 14px 14px 14px;padding:7px 11px;font-size:13.5px;line-height:1.45;word-break:break-word}
.cmsg.mine{align-self:flex-end;text-align:right}
.cmsg.mine .ctext{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border-radius:14px 4px 14px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:9px 0 8px}
.clbl{font-size:10.5px;font-weight:800;color:var(--sub);margin:0 2px}
.chip{background:rgba(99,102,241,.10);border:1.5px solid rgba(99,102,241,.35);border-radius:99px;padding:6px 11px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:active{background:rgba(99,102,241,.25)}
.chip.hot{background:rgba(236,72,153,.10);border-color:rgba(236,72,153,.45)}
.crow{display:flex;gap:8px}
.crow input{flex:1}
</style>
</head>
<body>
<div id="gbar"></div>
<header id="topbar"></header>
<main class="wrap" id="app"></main>
<div id="modalroot"></div>
