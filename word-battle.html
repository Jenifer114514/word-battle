<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6366f1">
<title>英単語バトル｜対戦・戦績・統計</title>
<style>
:root{
  --indigo:#6366f1; --violet:#8b5cf6; --pink:#ec4899; --rose:#f43f5e;
  --ink:#1e293b; --sub:#64748b; --line:#e2e8f0; --card:#ffffff;
  --ok:#10b981; --ng:#ef4444; --warn:#f59e0b;
  --r:16px; --shadow:0 6px 24px rgba(51,65,85,.09);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#eef2ff 0%,#fdf2f8 55%,#fff7ed 100%);min-height:100vh}
button{font-family:inherit}
h1,h2,h3,h4{margin:0}
/* ---------- header ---------- */
#topbar{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--indigo),var(--violet) 55%,var(--pink));color:#fff;
  box-shadow:0 4px 18px rgba(99,102,241,.35)}
.topin{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.topin .ttl{font-weight:800;font-size:17px;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.topin .ttl small{font-weight:600;opacity:.75;font-size:11px}
.tspace{flex:1}
.who{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.16);padding:4px 8px 4px 5px;border-radius:99px;font-size:13px;font-weight:700}
.sig{display:inline-flex;align-items:flex-end;gap:2.5px;background:rgba(0,0,0,.22);border-radius:8px;padding:6px 7px;cursor:default;flex:none}
.sig i{width:4.5px;border-radius:2.5px;background:rgba(255,255,255,.30)}
.sig i:nth-child(1){height:6px}.sig i:nth-child(2){height:9px}.sig i:nth-child(3){height:12px}.sig i:nth-child(4){height:15px}
.sig i.on{background:#fff}
.sig.c i.on{animation:blink 1.1s infinite}
.sig.r i.on{background:#fbbf24;animation:blink .8s infinite}
.sig.off i{background:rgba(255,255,255,.22)}
@keyframes blink{50%{opacity:.35}}
.avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;flex:none}
.avatar.big{width:60px;height:60px;font-size:24px;margin:0 auto 8px}
#lockbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:99px;width:34px;height:34px;font-size:15px;cursor:pointer}
#lockbtn:active{transform:scale(.94)}
/* ---------- layout ---------- */
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:14.5px;margin:14px 0 8px;color:var(--sub)}
.sub{color:var(--sub);font-size:13px;line-height:1.6}
.foot{text-align:center;color:#94a3b8;font-size:12px;margin-top:20px;line-height:1.8}
.foot button{background:none;border:0;color:#818cf8;cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
/* ---------- banner / notice ---------- */
.banner{background:#fff7ed;border:1.5px solid #fdba74;color:#9a3412;border-radius:12px;padding:10px 13px;font-size:13px;margin-bottom:13px;font-weight:700;line-height:1.6}
#gbar{max-width:760px;margin:12px auto -2px;padding:0 14px}
#gbar .banner{margin-bottom:0}
.notice{background:#eff6ff;border:1.5px solid #bfdbfe;color:#1e40af;border-radius:12px;padding:10px 13px;font-size:12.5px;margin-bottom:13px;line-height:1.7}
.notice b{display:block;margin-bottom:2px}
/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;
  font-size:15px;font-weight:800;cursor:pointer;background:#eef2ff;color:#4338ca;transition:transform .12s,box-shadow .12s}
.btn:active{transform:scale(.965)}
.btn.pri{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;box-shadow:0 4px 14px rgba(99,102,241,.35)}
.btn.pk{background:linear-gradient(135deg,var(--pink),var(--rose));color:#fff;box-shadow:0 4px 14px rgba(236,72,153,.35)}
.btn.ok{background:#d1fae5;color:#065f46}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--sub)}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px;font-weight:700}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap}
/* ---------- menu ---------- */
.mi{display:flex;gap:13px;align-items:center;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:14px 15px;margin-bottom:10px;cursor:pointer;font-size:15px;font-weight:800;color:var(--ink);transition:.13s}
.mi:hover{border-color:#c7d2fe}
.mi:active{transform:scale(.985)}
.mi .ic{font-size:23px;flex:none}
.mi .tx{flex:1;min-width:0}
.mi .tx small{display:block;color:var(--sub);font-weight:600;font-size:11.5px;margin-top:1px}
.mi .arr{color:#cbd5e1;font-weight:800}
.mi .cnt{background:var(--pink);color:#fff;border-radius:99px;font-size:11px;padding:2px 8px;font-weight:800}
/* ---------- forms ---------- */
label.f{display:block;font-size:12.5px;color:var(--sub);margin:13px 0 5px;font-weight:800}
input[type=text],input[type=password],input[type=search],input[type=number],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);
  border-radius:11px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
textarea{font-size:12px;font-family:ui-monospace,monospace}
input:focus,select:focus,textarea:focus{outline:2px solid #c7d2fe;border-color:var(--indigo)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:66px;padding:10px 6px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--sub);font-size:13.5px}
.seg button.on{border-color:var(--indigo);background:#eef2ff;color:#4338ca}
.check{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:8px;background:#fff;cursor:pointer;font-size:14px;font-weight:700}
.check input{width:18px;height:18px;accent-color:var(--indigo)}
.check .pinok{margin-left:auto}
/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.stat{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.stat .v{font-size:21px;font-weight:800;letter-spacing:.01em}
.stat .v small{font-size:12px;color:var(--sub);font-weight:700}
.stat .k{font-size:11px;color:var(--sub);font-weight:700;margin-top:2px}
.stat.hi{background:linear-gradient(135deg,#eef2ff,#fdf2f8);border-color:#c7d2fe}
/* ---------- battle ---------- */
.qdir{text-align:center;color:var(--sub);font-size:12.5px;font-weight:800;letter-spacing:.04em}
.qword{font-size:31px;font-weight:800;text-align:center;padding:16px 6px 12px;letter-spacing:.02em;word-break:break-word}
.qcount{text-align:center;font-size:12px;color:#94a3b8;font-weight:800;margin-bottom:4px}
.timer{height:9px;border-radius:99px;background:#eef2f7;overflow:hidden;margin:12px 0 4px}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#84cc16);border-radius:99px;transition:width .1s linear}
.timer i.hot{background:linear-gradient(90deg,#f59e0b,var(--ng))}
.tnum{text-align:center;font-size:12px;color:var(--sub);font-weight:800}
.choices{display:grid;gap:10px;margin-top:13px}
.choice{padding:14px 15px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;font-weight:700;cursor:pointer;text-align:left;color:var(--ink);transition:.12s}
.choice:active{transform:scale(.98)}
.choice.ok{border-color:var(--ok);background:#ecfdf5}
.choice.ng{border-color:var(--ng);background:#fef2f2}
.choice.dim{opacity:.5}
.pass{text-align:center;padding:26px 8px 10px}
.pass .vs{font-size:12px;color:#94a3b8;font-weight:800;letter-spacing:.1em;margin:10px 0}
.rk{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#fff}
.rk .no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:#f1f5f9;color:var(--sub);flex:none}
.rk.r1 .no{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#fff}
.rk.r2 .no{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#fff}
.rk.r3 .no{background:linear-gradient(135deg,#fb923c,#ea580c);color:#fff}
.rk .nm{font-weight:800;font-size:14.5px}
.rk .nm small{display:block;font-weight:600;color:var(--sub);font-size:11px}
.rk .pt{margin-left:auto;text-align:right}
.rk .pt b{font-size:17px}
.rk .pt small{display:block;font-size:10.5px;color:var(--sub);font-weight:700}
.rk.me{border-color:var(--indigo);background:#eef2ff}
.turnbar{display:flex;align-items:center;gap:9px;margin-bottom:6px}
.turnbar .lbl{font-size:12px;color:var(--sub);font-weight:800}
/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--sub);font-weight:800;text-align:left;padding:8px 7px;border-bottom:2px solid var(--line);white-space:nowrap;font-size:11.5px}
.tbl td{padding:8px 7px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl .c{text-align:center}
/* ---------- badges / meter ---------- */
.badge{display:inline-block;padding:2.5px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.b-gold{background:#fef3c7;color:#92400e}.b-sil{background:#e2e8f0;color:#334155}.b-brz{background:#ffedd5;color:#9a3412}
.b-ok{background:#d1fae5;color:#065f46}.b-ng{background:#fee2e2;color:#991b1b}.b-info{background:#e0e7ff;color:#3730a3}
.b-warn{background:#fef3c7;color:#92400e}.b-mut{background:#f1f5f9;color:#475569}.b-pk{background:#fce7f3;color:#9d174d}
.meter{height:7px;background:#f1f5f9;border-radius:99px;overflow:hidden;min-width:56px}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#ef4444)}
.meter.acc i{background:linear-gradient(90deg,#34d399,#10b981)}
/* ---------- weak word rows ---------- */
.wordrow{border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:9px;background:#fff}
.wr-top{display:flex;gap:10px;align-items:center}
.wr-main{flex:1;min-width:0;cursor:pointer}
.wr-e{font-weight:800;font-size:16px}
.wr-j{color:var(--sub);font-size:12.5px;margin-top:1px}
.wr-m{width:120px;flex:none;text-align:right}
.wr-m .sc{font-size:12px;font-weight:800;color:var(--ng)}
.wr-m .sc.low{color:var(--warn)}
.wr-m .cap{font-size:10px;color:#94a3b8;font-weight:700}
.wr-sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hist{margin-top:10px;border-top:1.5px dashed var(--line);padding-top:9px;font-size:12px;color:var(--sub)}
.hist .he{display:flex;gap:7px;padding:2.5px 0;font-variant-numeric:tabular-nums}
.hist .he b{font-weight:700;color:var(--ink)}
/* ---------- charts ---------- */
.chartbox svg{width:100%;height:auto;display:block}
.axis{font-size:10px;fill:#94a3b8}
.gline{stroke:#eef2f7;stroke-width:1}
.poly{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.dot{stroke:#fff;stroke-width:1.5}
.bar{rx:3}
/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;margin-bottom:13px;overflow-x:auto;padding-bottom:2px}
.tabs button{flex:none;padding:9px 15px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:800;cursor:pointer;color:var(--sub);font-size:13px}
.tabs button.on{background:linear-gradient(135deg,var(--indigo),var(--violet));border-color:transparent;color:#fff}
/* ---------- modal / toast ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
@media(min-width:560px){.modal{align-items:center}}
.sheet{background:#fff;width:100%;max-width:580px;max-height:86vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;animation:up .18s}
@media(min-width:560px){.sheet{border-radius:20px}}
.sheet h2{font-size:16.5px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#1e293b;color:#fff;padding:11px 20px;border-radius:99px;
  font-size:13.5px;font-weight:700;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:fade .2s;max-width:88vw;text-align:center}
/* ---------- misc ---------- */
.empty{text-align:center;color:var(--sub);padding:36px 12px;font-size:14px;line-height:1.8}
.empty .big{font-size:42px;display:block;margin-bottom:6px}
.klist{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.klist .badge{cursor:default}
.divh{border:0;border-top:1.5px solid var(--line);margin:14px 0}
.pinok{font-size:11px}
.center{text-align:center}
.mt{margin-top:12px}.mb{margin-bottom:12px}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.pop{animation:up .18s}
@media(max-width:420px){
  .grid2{grid-template-columns:1fr 1fr}
  .qword{font-size:26px}
  .wr-m{width:96px}
}
/* ---------- チャット ---------- */
#chatFab{position:fixed;right:14px;bottom:14px;z-index:60;width:52px;height:52px;border-radius:50%;border:0;
  background:linear-gradient(135deg,var(--indigo),var(--pink));color:#fff;font-size:21px;cursor:pointer;
  box-shadow:0 6px 18px rgba(30,20,80,.4);display:none;place-items:center}
#chatFab:active{transform:scale(.93)}
#chatFab .cbadge{position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;border-radius:99px;min-width:20px;height:20px;
  font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
#chatPanel{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,10,40,.45)}
#chatPanel .sheet{background:var(--card);width:100%;max-width:760px;max-height:74vh;border-radius:18px 18px 0 0;
  display:flex;flex-direction:column;padding:12px 12px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chead b{font-size:15px}
#chatClose{border:0;background:rgba(0,0,0,.08);width:30px;height:30px;border-radius:50%;font-size:13px;cursor:pointer;color:var(--ink)}
#chatLog{overflow-y:auto;flex:1;min-height:120px;padding:4px 2px;display:flex;flex-direction:column;gap:7px}
.cmsg{max-width:82%}
.cmsg small{display:block;color:var(--sub);font-size:10.5px;margin:0 2px 1px}
.cmsg .ctext{background:#f1f5f9;border-radius:4px 14px 14px 14px;padding:7px 11px;font-size:13.5px;line-height:1.45;word-break:break-word}
.cmsg.mine{align-self:flex-end;text-align:right}
.cmsg.mine .ctext{background:linear-gradient(135deg,var(--indigo),var(--violet));color:#fff;border-radius:14px 4px 14px 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:9px 0 8px}
.clbl{font-size:10.5px;font-weight:800;color:var(--sub);margin:0 2px}
.chip{background:rgba(99,102,241,.10);border:1.5px solid rgba(99,102,241,.35);border-radius:99px;padding:6px 11px;
  font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip:active{background:rgba(99,102,241,.25)}
.chip.hot{background:rgba(236,72,153,.10);border-color:rgba(236,72,153,.45)}
.crow{display:flex;gap:8px}
.crow input{flex:1}
</style>
</head>
<body>
<div id="gbar"></div>
<header id="topbar"></header>
<main class="wrap" id="app"></main>
<div id="modalroot"></div>

function registerAccount(name){
  name=String(name||"").trim().slice(0,12);
  if(!name)return {error:"ユーザー名を入力してください"};
  if(name.length<2)return {error:"ユーザー名は2文字以上にしてください"};

    return {error:"この端末には既にアカウントがあります"+(ex?"（"+ex.name+"）":"")};
  }
  if(nameTaken(name))return {error:"その名前は既に使われています"};
  var pid=uid("p_");
  var prof={id:pid,name:name,color:COLORS[Object.keys(DB.profiles).length%COLORS.length],
    createdAt:new Date().toISOString(),nameChangedAt:new Date().toISOString(),

}
function NAME_CHANGE_MS(){return 7*86400000;}
function tryRename(prof,newName){
  newName=String(newName||"").trim().slice(0,12);
  if(!newName||newName===prof.name)return {ok:true};
  var elapsed=Date.now()-new Date(prof.nameChangedAt||prof.createdAt).getTime();
  if(elapsed<NAME_CHANGE_MS()){
    var days=Math.ceil((NAME_CHANGE_MS()-elapsed)/86400000);
    return {error:"名前の変更は前回から7日後です（あと"+days+"日）"};
  }
  if(nameTaken(newName))return {error:"その名前は既に使われています"};
  prof.name=newName;prof.nameChangedAt=new Date().toISOString();
  return {ok:true};
}

/* ================= 単語別の記録 ================= */
function ensureStat(prof,wid){
  if(!prof.wordStats)prof.wordStats={};
  if(!prof.wordStats[wid]){
    prof.wordStats[wid]={wid:wid,asked:0,correct:0,wrong:0,sumTime:0,lastAt:"",
      dir:{ej:{asked:0,correct:0,sumTime:0},je:{asked:0,correct:0,sumTime:0}},history:[]};
  }
  return prof.wordStats[wid];
}
function recordAnswer(prof,wid,dir,mode,ok,timeMs){
  var st=ensureStat(prof,wid);
  st.asked++;st.sumTime+=timeMs;st.lastAt=new Date().toISOString();
  var d=st.dir[dir]||(st.dir[dir]={asked:0,correct:0,sumTime:0});d.asked++;d.sumTime+=timeMs;
  if(ok){st.correct++;d.correct++;}else st.wrong++;
  st.history.push({t:st.lastAt,dir:dir,mode:mode,ok:ok?1:0,timeMs:Math.round(timeMs)});
  if(st.history.length>80)st.history=st.history.slice(-80);
}

/* ================= 戦績集計 ================= */
function battleStats(prof){
  var bs=(prof.battles||[]).slice().sort(function(a,b){return a.date<b.date?-1:1;});
  var total=bs.length,w=0,l=0,d=0,pts=0,accSum=0,tSum=0,tN=0;
  var streak=0,best=0;
  bs.forEach(function(b){
    pts+=b.me.points;accSum+=b.me.accuracy;tSum+=b.me.avgTimeMs;tN++;
    if(b.me.rank===1){var same=b.players.filter(function(p){return p.rank===1;}).length;
      if(same===1){w++;streak++;best=Math.max(best,streak);}else{d++;streak=0;}}
    else{l++;streak=0;}
  });
  return {total:total,w:w,l:l,d:d,winRate:total?w/total:0,points:pts,
    avgAcc:total?accSum/total:0,avgTime:tN?tSum/tN:0,streakBest:best,streakCur:streak};
}

/* ================= 出題ビルダー ================= */
function buildQuestion(w,dir){
  var correctText=dir==="ej"?w.j:w.e;
  var seen={};seen[correctText]=true;
  var same=shuffle(WORDS.filter(function(x){return x.id!==w.id&&x.lv===w.lv;}));
  var rest=shuffle(WORDS.filter(function(x){return x.id!==w.id&&x.lv!==w.lv;}));
  var pool=same.concat(rest),ds=[];
  for(var i=0;i<pool.length&&ds.length<3;i++){
    var v=pool[i][dir==="ej"?"j":"e"];
    if(!seen[v]){seen[v]=true;ds.push(v);}
  }
  var options=shuffle([correctText].concat(ds));
  return {wid:w.id,dir:dir,text:dir==="ej"?w.e:w.j,options:options,correct:options.indexOf(correctText)};
}

/* ================= ルーム対戦（PeerJS・P2Pで別々の端末と同時対戦） =================
   ホストが問題を管理。切断時はゲストが自動再接続（途中復帰つき）。
   ホストが消えた場合はゲストがルームを引き継ぐ（ホスト交代）。
   通信状況はヘッダー左上のシグナルバーに表示。 */
var R2={peer:null,code:"",isHost:false,myPid:"",conns:{},hostConn:null,
  players:{},order:[],settings:null,qs:[],qi:0,phase:"idle",qStart:0,
  REVEAL_MS:4500,t1:null,t2:null,tick:null,hb:null,wd:null,tEnd:null,
  view:null,answered:false,cur:null,saveDone:false,
  leaving:false,lastMsgAt:0,reconnecting:false,attempts:0,migrating:false,
  seen:{},lastResults:null,lastEnd:null,dropTo:{},DROP_MS:10000,WD_MS:2000,
  qlog:[],lastScores:[],chat:[],chatUnread:0,chatLastSent:0,chatRate:{},chatSeq:0};
var CHAT_OPEN=false;
var PEER_PREFIX="wbtl-v3-";
var PEER_CONFIG={config:{iceServers:[
  {urls:"stun:stun.l.google.com:19302"},
  {urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},
  {urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}]}};
var CODE_CHARS="23456789ABCDEFGHJKMNPQRSTUVWXYZ";

function roomStop(){
  if(R2.t1){clearTimeout(R2.t1);R2.t1=null;}
  if(R2.t2){clearTimeout(R2.t2);R2.t2=null;}
  if(R2.tick){clearInterval(R2.tick);R2.tick=null;}
  /* wd（無通信監視）・hbは画面遷移でも止めない（teardownで停止） */
}
function startHostLiveness(){ /* hb全配信＋無通信監視（交代ホストでも共用） */
  if(R2.hb)clearInterval(R2.hb);
  R2.hb=setInterval(function(){hostBroadcast({t:"hb"});},5000);
  if(R2.wd)clearInterval(R2.wd);
  R2.wd=setInterval(function(){
    var now=Date.now();
    activePlayers().forEach(function(pid){
      if(pid===R2.myPid)return;
      var lim=R2.phase==="lobby"?25000:R2.DROP_MS; /* ゲーム中は10秒無通信でleft */
      if(R2.seen[pid]&&now-R2.seen[pid]>lim)guestLeft(pid);
    });
  },R2.WD_MS);
}
function roomTeardown(){
  R2.leaving=true;
  roomStop();
  if(R2.hb){clearInterval(R2.hb);R2.hb=null;}
  if(R2.tEnd){clearTimeout(R2.tEnd);R2.tEnd=null;}
  Object.keys(R2.dropTo).forEach(function(k){clearTimeout(R2.dropTo[k]);});
  R2.dropTo={};
  Object.keys(R2.conns).forEach(function(k){try{R2.conns[k].close();}catch(e){}});
  R2.conns={};
  if(R2.hostConn){try{R2.hostConn.close();}catch(e){}R2.hostConn=null;}
  if(R2.peer){try{R2.peer.destroy();}catch(e){}R2.peer=null;}
  R2.code="";R2.myPid="";R2.players={};R2.order=[];R2.qs=[];R2.qi=0;
  R2.phase="idle";R2.view=null;R2.cur=null;R2.saveDone=false;R2.isHost=false;R2.answered=false;
  R2.reconnecting=false;R2.attempts=0;R2.lastResults=null;R2.lastEnd=null;R2.lastMsgAt=0;
  R2.migrating=false;R2.qlog=[];R2.lastScores=[];
  R2.chat=[];R2.chatUnread=0;R2.chatRate={};CHAT_OPEN=false;
  var __cp=document.querySelector("#chatPanel");if(__cp&&__cp.remove)__cp.remove();
  setNet("hide");
}
function activePlayers(){
  return R2.order.filter(function(pid){return R2.players[pid]&&!R2.players[pid].left;});
}
function answeredCount(){return activePlayers().filter(function(pid){return R2.players[pid].answers[R2.qi];}).length;}
function sendThenClose(conn,msg){
  try{conn.send(msg);}catch(e){}
  setTimeout(function(){try{conn.close();}catch(e){}},800);
}
function hostBroadcast(msg){Object.keys(R2.conns).forEach(function(pid){try{if(R2.conns[pid].open)R2.conns[pid].send(msg);}catch(e){}});}
function scoreSnapshot(){
  return R2.order.map(function(pid){var p=R2.players[pid];
    return {id:pid,name:p.name,color:p.color,points:p.points,left:!!p.left};})
    .sort(function(a,b){return b.points-a.points;});
}

/* ---------- ホスト: ルーム作成 ---------- */
function roomCreate(){
  var attempt=0;
  function tryCreate(){
    var code="";for(var i=0;i<4;i++)code+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];
    return roomCreateAt(code).then(function(r){
      if(r&&r.taken&&attempt<5){attempt++;return tryCreate();}
      if(r&&r.taken)return {error:"ルームを作成できませんでした。もう一度お試しください"};
      return r;
    });
  }
  return tryCreate();
}
function roomCreateAt(code){ /* 固定コードでルーム作成（テンプレ部屋用） */
  var m=me();
  return new Promise(function(resolve){
    var peer;
    try{peer=new Peer(PEER_PREFIX+code,PEER_CONFIG);}catch(e){return resolve({error:"PeerJSを初期化できません: "+e.message});}
    var settled=false;
    var to=setTimeout(function(){if(!settled){settled=true;try{peer.destroy();}catch(e){}resolve({error:"接続に時間がかかりすぎます。ネットワークを確認してください"});}},12000);
    peer.on("open",function(){
      if(settled){try{peer.destroy();}catch(e){}return;}
      settled=true;clearTimeout(to);
      R2.peer=peer;R2.code=code;R2.isHost=true;R2.myPid="h";
      R2.players={};R2.order=[];
      R2.players.h={id:"h",name:m.name,color:m.color,host:true,points:0,left:false,answers:{}};
      R2.order.push("h");
      R2.phase="lobby";
      peer.on("connection",function(conn){wireHostConn(conn);});
      peer.on("error",function(e){hostPeerError(e);});
      R2.leaving=false;
      startHostLiveness();
      setNet("ok");
      resolve({ok:true,code:code});
    });
    peer.on("error",function(e){
      if(settled)return;
      settled=true;clearTimeout(to);
      try{peer.destroy();}catch(e2){}
      if(e&&e.type==="unavailable-id")return resolve({taken:true});
      resolve({error:peerErrMsg(e)});
    });
  });
}
function peerErrMsg(e){
  var t=e&&e.type;
  if(t==="peer-unavailable")return "そのコードのルームが見つかりません";
  if(t==="unavailable-id")return "IDが使用中です";
  if(t==="network"||t==="socket-error"||t==="server-error"||t==="socket-closed")return "PeerJSシグナリングサーバーに接続できません。インターネット接続を確認してください";
  return "接続エラー"+(t?"（"+t+"）":"")+"が発生しました";
}
function wireHostConn(conn){
  var pidRef={pid:null};
  conn.on("data",function(msg){
    if(!msg)return;
    if(pidRef.pid){
      R2.seen[pidRef.pid]=Date.now();
      if(R2.dropTo[pidRef.pid]){clearTimeout(R2.dropTo[pidRef.pid]);delete R2.dropTo[pidRef.pid];} /* 通信が続いているので猶予解除 */
      var pp=R2.players[pidRef.pid];
      if(pp&&pp.left&&R2.phase!=="lobby"&&R2.phase!=="end"){ /* 戻ってきたら復帰 */
        pp.left=false;
        hostBroadcast({t:"wait",qi:R2.qi,answered:answeredCount(),totalP:activePlayers().length,scores:scoreSnapshot()});
      }
    }
    if(msg.t==="hb"){try{conn.send({t:"hb"});}catch(e){}return;}
    if(msg.t==="count"){ /* 公開ルームの人数調査 */
      var cn=R2.phase==="end"?0:activePlayers().length;
      try{conn.send({t:"count",n:cn,phase:R2.phase});}catch(e){}
      setTimeout(function(){try{conn.close();}catch(e){}},300);
      return;
    }
    if(msg.t==="hello"){
      var name=String(msg.name||"").trim().slice(0,12)||"Guest";
      if(R2.phase==="end"){
        if(R2.lastEnd&&msg.rejoin&&msg.prevPid&&R2.players[msg.prevPid]){sendThenClose(conn,R2.lastEnd);return;}
        else{sendThenClose(conn,{t:"rejected",reason:"このルームは終了しました"});return;}
        return;
      }
      if(R2.phase!=="lobby"&&!(msg.rejoin&&R2.players[msg.prevPid])){sendThenClose(conn,{t:"rejected",reason:"このルームはすでに始まっています"});return;}
      if(R2.phase==="lobby"&&msg.rejoin&&msg.prevPid&&R2.players[msg.prevPid]){
        var lp2=R2.players[msg.prevPid];
        if(R2.dropTo[lp2.id]){clearTimeout(R2.dropTo[lp2.id]);delete R2.dropTo[lp2.id];}
        lp2.left=false;
        pidRef.pid=lp2.id;
        R2.conns[lp2.id]=conn;R2.seen[lp2.id]=Date.now();
        try{conn.send({t:"welcome",pid:lp2.id,code:R2.code,settings:R2.settings,players:lobbyPlayers()});}catch(e){}
        hostBroadcast({t:"lobby",players:lobbyPlayers(),settings:R2.settings,code:R2.code});
        if(route.name==="roomLobby")renderLobby();
        conn.on("close",function(){hostConnDropped(lp2.id);});
        conn.on("error",function(){hostConnDropped(lp2.id);});
        return;
      }
      if(msg.rejoin&&msg.prevPid&&R2.players[msg.prevPid]&&R2.phase!=="lobby"){
        var rp=R2.players[msg.prevPid];
        if(R2.dropTo[rp.id]){clearTimeout(R2.dropTo[rp.id]);delete R2.dropTo[rp.id];} /* 猶予中の復帰 */
        rp.left=false;
        pidRef.pid=rp.id;
        R2.conns[rp.id]=conn;R2.seen[rp.id]=Date.now();
        hostResume(rp,conn);
        if(route.name==="roomBattle"&&R2.view&&R2.view.type==="q"){var w={t:"wait",qi:R2.qi,answered:answeredCount(),totalP:activePlayers().length,scores:scoreSnapshot()};try{conn.send(w);}catch(e){}}
        conn.on("close",function(){hostConnDropped(rp.id);});
        conn.on("error",function(){hostConnDropped(rp.id);});
        return;
      }
      var dup=R2.order.some(function(pid){return R2.players[pid].name===name&&!R2.players[pid].left;});
      if(dup){sendThenClose(conn,{t:"rejected",reason:"その名前は既に参加しています"});return;}
      if(activePlayers().length>=8){sendThenClose(conn,{t:"rejected",reason:"ルームが満員です"});return;}
      var pid="g"+uid("");
      pidRef.pid=pid;
      R2.players[pid]={id:pid,name:name,color:msg.color||"#ec4899",host:false,points:0,left:false,answers:{}};
      R2.order.push(pid);R2.conns[pid]=conn;R2.seen[pid]=Date.now();
      try{conn.send({t:"welcome",pid:pid,code:R2.code,settings:R2.settings,players:lobbyPlayers()});}catch(e){}
      hostBroadcast({t:"lobby",players:lobbyPlayers(),settings:R2.settings,code:R2.code});
      if(route.name==="roomLobby")renderLobby();
      conn.on("close",function(){hostConnDropped(pid);});
      conn.on("error",function(){hostConnDropped(pid);});
      return;
    }
    if(msg.t==="answer"&&pidRef.pid){
      if(R2.phase==="question"&&+msg.qi===R2.qi)applyAnswer(pidRef.pid,+msg.choice);
    }
    if(msg.t==="chat"&&pidRef.pid){
      var cp=R2.players[pidRef.pid];
      if(cp)hostChatMsg(pidRef.pid,cp.name,String(msg.text||""));
    }
  });
}
function hostResume(p,conn){
  var base={t:"resume",pid:p.id,code:R2.code,settings:R2.settings,total:R2.qs.length,players:lobbyPlayers()};
  if(R2.phase==="question"){
    var q=R2.qs[R2.qi];
    base.phase="q";
    base.q={dir:q.dir,text:q.text,options:q.options};
    base.qi=R2.qi;
    base.remainMs=Math.max(1000,R2.settings.limit*1000-(Date.now()-R2.qStart));
    base.meAnswered=!!p.answers[R2.qi];
  }else if(R2.phase==="reveal"){
    base.phase="reveal";
    var q2=R2.qs[R2.qi];
    base.qi=R2.qi;
    base.q={dir:q2.dir,text:q2.text,options:q2.options};
    base.correct=q2.correct;
    base.results=lastRevealResults();
    base.nextMs=Math.max(500,R2.revealUntil-Date.now());
  }else{
    base.phase="lobby";
  }
  try{conn.send(base);}catch(e){}
}
function lastRevealResults(){
  if(R2.lastResults)return R2.lastResults;
  return scoreSnapshot().map(function(s){
    var a=R2.players[s.id].answers[R2.qi]||{};
    return {id:s.id,name:s.name,ok:!!a.ok,timeMs:a.timeMs||null,point:a.point||0,total:s.points};
  });
}
function hostConnDropped(pid){ /* 切断検知: ロビーは即除外、ゲーム中はDROP_MS(10秒)猶予 */
  if(R2.phase==="lobby"){guestLeft(pid);return;}
  startDropTimer(pid);
}
function startDropTimer(pid){ /* 10秒戻らなければ無回答扱い（left）にして先へ進む */
  if(R2.dropTo[pid])return;
  R2.dropTo[pid]=setTimeout(function(){
    delete R2.dropTo[pid];
    var p=R2.players[pid];
    if(!p||p.left||R2.phase==="end"||R2.leaving)return;
    guestLeft(pid);
  },R2.DROP_MS);
}
function guestLeft(pid){
  var p=R2.players[pid];if(!p||p.left)return;
  if(R2.dropTo[pid]){clearTimeout(R2.dropTo[pid]);delete R2.dropTo[pid];}
  delete R2.conns[pid];
  if(R2.phase==="lobby"){delete R2.players[pid];R2.order=R2.order.filter(function(x){return x!==pid;});
    hostBroadcast({t:"lobby",players:lobbyPlayers(),settings:R2.settings,code:R2.code});
    if(route.name==="roomLobby")renderLobby();
  }else{
    p.left=true;
    hostBroadcast({t:"wait",qi:R2.qi,answered:answeredCount(),totalP:activePlayers().length,scores:scoreSnapshot()});
    if(R2.phase==="question"){ /* 残ったメンバーが全員回答済みなら即解答表示へ */
      var ans=answeredCount(),tot=activePlayers().length;
      if(ans>0&&ans>=tot){if(R2.t1)clearTimeout(R2.t1);R2.t1=setTimeout(revealNow,350);}
    }
  }
}
function lobbyPlayers(){
  return R2.order.map(function(pid){var p=R2.players[pid];
    return {id:pid,name:p.name,color:p.color,host:!!p.host,left:!!p.left};});
}
function hostPeerError(e){
  if(R2.phase==="lobby"){toast(peerErrMsg(e));roomTeardown();go("roomSetup");}
  else setNet("off");
}

/* ---------- ホスト: 開始・出題 ---------- */
function roomStartGame(){
  var pool=R2.settings.lv==="mix"?WORDS:WORDS.filter(function(w){return String(w.lv)===String(R2.settings.lv);});
  var picked=shuffle(pool).slice(0,Math.min(R2.settings.count,pool.length));
  R2.qs=picked.map(function(w,i){
    var dir=R2.settings.dir==="mix"?(Math.random()<.5?"ej":"je"):R2.settings.dir;
    var q=buildQuestion(w,dir);q.qi=i;q.wid=w.id;return q;
  });
  R2.qi=0;R2.phase="question";
  hostBroadcast({t:"start",settings:R2.settings,total:R2.qs.length,players:lobbyPlayers()});
  sendQuestion();
}
function sendQuestion(){
  var q=R2.qs[R2.qi];
  var payload={t:"q",qi:R2.qi,total:R2.qs.length,q:{dir:q.dir,text:q.text,options:q.options},remainMs:R2.settings.limit*1000};
  hostBroadcast(payload);
  R2.view={type:"q",qi:R2.qi,total:R2.qs.length,q:payload.q,remainMs:payload.remainMs,recvAt:Date.now()};
  R2.cur=payload;R2.answered=false;
  go("roomBattle");
  R2.qStart=Date.now();
  R2.t1=setTimeout(function(){revealNow();},R2.settings.limit*1000+400);
}
function hostAnswered(pid){
  var wait={t:"wait",qi:R2.qi,answered:answeredCount(),totalP:activePlayers().length,scores:scoreSnapshot()};
  hostBroadcast(wait);
  R2.cur=wait;
  if(route.name==="roomBattle"&&R2.view&&R2.view.type==="q")updateWaitBox(wait);
  if(wait.answered>0&&wait.answered>=wait.totalP){if(R2.t1)clearTimeout(R2.t1);R2.t1=setTimeout(function(){revealNow();},350);}
}
function applyAnswer(pid,choice){
  var p=R2.players[pid];
  if(!p||R2.phase!=="question"||p.answers[R2.qi])return;
  var q=R2.qs[R2.qi];
  var limitMs=R2.settings.limit*1000;
  var elapsed=clamp(Date.now()-R2.qStart,0,limitMs);
  var ok=choice===q.correct;
  var point=ok?10+Math.round(5*(1-elapsed/limitMs)):0;
  p.answers[R2.qi]={choice:choice,ok:ok,timeMs:Math.round(elapsed),point:point,ans:choice>=0&&choice<q.options.length?q.options[choice]:"（時間切れ）"};
  p.points+=point;
  hostAnswered(pid);
}
function hostAdvance(){
  R2.qi++;
  R2.lastResults=null;
  if(R2.qi>=R2.qs.length)endGame();
  else{R2.phase="question";sendQuestion();}
}
function roomForceNext(){ /* ホスト:全員回答済みならrevealを飛ばして次へ */
  if(!R2.isHost||R2.phase!=="reveal"||!R2.view||!R2.view.canSkip)return;
  if(R2.t2){clearTimeout(R2.t2);R2.t2=null;}
  hostAdvance();
}
function revealNow(){
  if(R2.phase!=="question")return;
  if(R2.t1){clearTimeout(R2.t1);R2.t1=null;}
  var allAns=answeredCount()>=activePlayers().length;
  R2.phase="reveal";
  var q=R2.qs[R2.qi];
  R2.lastResults=scoreSnapshot().map(function(s){
    var a=R2.players[s.id].answers[R2.qi];
    return {id:s.id,name:s.name,ok:!!a&&!!a.ok,nas:!a,timeMs:a?a.timeMs||null:null,point:a?a.point||0:0,total:s.points};
  });
  R2.revealUntil=Date.now()+R2.REVEAL_MS;
  var msg={t:"reveal",qi:R2.qi,correct:q.correct,results:R2.lastResults};
  hostBroadcast(msg);
  R2.view={type:"reveal",qi:R2.qi,total:R2.qs.length,q:{dir:q.dir,text:q.text,options:q.options},correct:q.correct,results:R2.lastResults,nextMs:R2.REVEAL_MS,recvAt:Date.now(),canSkip:R2.isHost&&allAns};
  go("roomBattle");
  R2.t2=setTimeout(hostAdvance,R2.REVEAL_MS);
}
function endGame(){
  R2.phase="end";
  var ranked=R2.order.map(function(pid){return R2.players[pid];}).sort(function(a,b){return b.points-a.points;});
  var rank=0,prev=null;
  ranked.forEach(function(p,i){if(p.points!==prev){rank=i+1;prev=p.points;}p.rank=rank;});
  var n=R2.qs.length||1;
  var playersEnd=ranked.map(function(p){
    var correct=0,sumT=0;
    R2.qs.forEach(function(q){var a=p.answers[q.qi];if(a&&a.ok)correct++;sumT+=a?a.timeMs:R2.settings.limit*1000;});
    return {id:p.id,name:p.name,color:p.color,points:p.points,rank:p.rank,left:!!p.left,
      correct:correct,wrong:n-correct,accuracy:correct/n,avgTimeMs:Math.round(sumT/n)};
  });
  var msg={t:"end",code:R2.code,date:new Date().toISOString(),total:n,settings:R2.settings,players:playersEnd,
    questions:R2.qs.map(function(q){
      var answers={};
      R2.order.forEach(function(pid){var p=R2.players[pid];var a=p.answers[q.qi];
        answers[pid]=a?{choice:a.choice,ok:a.ok,timeMs:a.timeMs,point:a.point,ans:a.ans}
          :{choice:-1,ok:false,timeMs:R2.settings.limit*1000,point:0,ans:"（未回答）"};});
      return {wid:q.wid,dir:q.dir,text:q.text,options:q.options,correct:q.correct,answers:answers};
    })};
  hostBroadcast(msg);
  R2.lastEnd=msg;
  saveRoomRecord(msg);
  R2.tEnd=setTimeout(function(){roomTeardown();},60000); /* 再接続用に1分だけ待機 */
}

/* ---------- ゲスト ---------- */
function roomJoin(code,rejoin){
  return new Promise(function(resolve){
    if(!/^[A-Z0-9]{4,5}$/.test(code))return resolve({error:"4〜5桁のルームコードを入力してください"});
    var m=me();var peer;
    try{peer=new Peer(PEER_CONFIG);}catch(e){return resolve({error:"PeerJSを初期化できません: "+e.message});}
    var settled=false;
    var to=setTimeout(function(){if(!settled){settled=true;try{peer.destroy();}catch(e){}resolve({error:"接続に時間がかかりすぎます。ネットワークを確認してください"});}},15000);
    peer.on("error",function(e){
      if(settled)return;
      settled=true;clearTimeout(to);
      try{peer.destroy();}catch(e2){}
      resolve({error:peerErrMsg(e),errType:e&&e.type});
    });
    peer.on("open",function(){
      var conn=peer.connect(PEER_PREFIX+code,{reliable:true});
      var opened=false;
      conn.on("open",function(){
        opened=true;clearTimeout(to);settled=true;
        R2.peer=peer;R2.hostConn=conn;R2.code=code;R2.isHost=false;
        R2.leaving=false;
        wireGuestConn(conn);
        var hello={t:"hello",name:m.name,color:m.color};
        if(rejoin&&rejoin.prevPid){hello.rejoin=true;hello.prevPid=rejoin.prevPid;}
        try{conn.send(hello);}catch(e){}
        resolve({ok:true});
      });
      conn.on("error",function(){
        if(!opened&&!settled){settled=true;clearTimeout(to);try{peer.destroy();}catch(e2){}
          resolve({error:"ルームに接続できませんでした"});}
      });
    });
  });
}
function wireGuestConn(conn){
  conn.on("data",function(msg){
    if(!msg)return;
    R2.lastMsgAt=Date.now();
    if(R2.reconnecting){R2.reconnecting=false;R2.attempts=0;setNet("ok");}
    switch(msg.t){
      case "hb":
        try{conn.send({t:"hb"});}catch(e){}
        break;
      case "welcome":
        R2.myPid=msg.pid;R2.settings=msg.settings;R2.players={};
        (msg.players||[]).forEach(function(p){R2.players[p.id]=p;});
        R2.order=(msg.players||[]).map(function(p){return p.id;});
        R2.qlog=[];R2.lastScores=[];
        R2.phase="lobby";
        setNet("ok");
        startGuestWatchdog();
        if(route.name!=="roomLobby")go("roomLobby");else renderLobby();
        break;
      case "lobby":
        R2.players={};(msg.players||[]).forEach(function(p){R2.players[p.id]=p;});
        R2.order=(msg.players||[]).map(function(p){return p.id;});
        if(R2.settings&&msg.settings)R2.settings=msg.settings;
        if(route.name==="roomLobby")renderLobby();
        break;
      case "start":
        R2.saveDone=false;
        if(R2.tEnd){clearTimeout(R2.tEnd);R2.tEnd=null;}
        R2.settings=msg.settings;R2.total=msg.total;R2.qi=-1;R2.phase="waiting-q";
        R2.qlog=[];R2.lastScores=(R2.order||[]).map(function(pid){var p=R2.players[pid];return {id:pid,points:p?p.points:0};});
        go("roomBattle");
        break;
      case "q":
        R2.phase="question";R2.answered=!!msg.meAnswered;R2.qi=msg.qi;
        R2.cur=msg;R2.view={type:"q",qi:msg.qi,total:msg.total,q:msg.q,remainMs:msg.remainMs,recvAt:Date.now()};
        R2.qlog[msg.qi]={dir:msg.q.dir,text:msg.q.text,options:msg.q.options,correct:null,results:null};
        go("roomBattle");
        break;
      case "wait":
        R2.cur=msg;
        if(msg.scores)R2.lastScores=msg.scores;
        if(route.name==="roomBattle"&&R2.view&&R2.view.type==="q")updateWaitBox(msg);
        break;
      case "reveal":
        R2.phase="reveal";
        R2.view={type:"reveal",qi:msg.qi,total:R2.total||0,results:msg.results,correct:msg.correct,q:R2.view&&R2.view.type==="q"?R2.view.q:null,recvAt:Date.now(),nextMs:R2.REVEAL_MS+500};
        if(R2.qlog[msg.qi]){R2.qlog[msg.qi].correct=msg.correct;R2.qlog[msg.qi].results=msg.results;}
        if(msg.results)R2.lastScores=msg.results.map(function(r){return {id:r.id,points:r.total};});
        go("roomBattle");
        break;
      case "resume":
        handleResume(msg);
        break;
      case "chat":
        if(msg.pid===R2.myPid)break; /* 自分はローカル表示済み */
        chatPush({pid:msg.pid,name:msg.name,text:msg.text,mine:false});
        if(!CHAT_OPEN)toast("💬 "+msg.name+"："+msg.text);
        break;
      case "rejected":
        toast(msg.reason||"参加できませんでした");roomTeardown();go("roomSetup");
        break;
      case "end":
        if(!R2.saveDone){R2.saveDone=true;saveRoomRecord(msg);}
        R2.lastEnd=msg;
        if(R2.tEnd)clearTimeout(R2.tEnd);
        R2.tEnd=setTimeout(function(){roomTeardown();},60000); /* 再戦を1分だけ待機 */
        break;
    }
  });
  conn.on("close",function(){
    if(R2.leaving||!R2.peer)return;
    if(R2.phase==="end"){roomTeardown();return;} /* 終了後の切断は静かに退出 */
    setNet("r");
    guestReconnect();
  });
  conn.on("error",function(){
    if(R2.leaving||!R2.peer)return;
    if(R2.phase==="end"){roomTeardown();return;}
    setNet("r");
    guestReconnect();
  });
}
function handleResume(msg){
  R2.myPid=msg.pid;
  if(msg.settings)R2.settings=msg.settings;
  if(msg.players){R2.players={};(msg.players||[]).forEach(function(p){R2.players[p.id]=p;});R2.order=(msg.players||[]).map(function(p){return p.id;});}
  startGuestWatchdog();
  if(msg.phase==="lobby"){R2.phase="lobby";go("roomLobby");return;}
  R2.total=msg.total;
  if(msg.phase==="q"){
    R2.phase="question";R2.answered=!!msg.meAnswered;R2.qi=msg.qi;
    R2.cur=msg;R2.view={type:"q",qi:msg.qi,total:msg.total,q:msg.q,remainMs:msg.remainMs,recvAt:Date.now()};
    R2.qlog[msg.qi]={dir:msg.q.dir,text:msg.q.text,options:msg.q.options,correct:null,results:null};
    go("roomBattle");
  }else if(msg.phase==="reveal"){
    R2.phase="reveal";
    R2.view={type:"reveal",qi:msg.qi,total:msg.total,q:msg.q,correct:msg.correct,results:msg.results,recvAt:Date.now(),nextMs:msg.nextMs};
    var ql=R2.qlog[msg.qi]||(R2.qlog[msg.qi]={dir:null,text:null,options:null,correct:null,results:null});
    if(msg.q){ql.dir=msg.q.dir;ql.text=msg.q.text;ql.options=msg.q.options;}
    ql.correct=msg.correct;ql.results=msg.results;
    if(msg.results)R2.lastScores=msg.results.map(function(r){return {id:r.id,points:r.total};});
    go("roomBattle");
  }
}
function startGuestWatchdog(){
  if(R2.wd)clearInterval(R2.wd);
  R2.wd=setInterval(function(){
    if(R2.leaving||R2.reconnecting||!R2.peer)return;
    if(R2.phase!=="lobby"&&R2.phase!=="waiting-q"&&R2.phase!=="question"&&R2.phase!=="reveal")return;
    if(R2.lastMsgAt&&Date.now()-R2.lastMsgAt>20000){
      setNet("r");
      try{R2.hostConn.close();}catch(e){}
      guestReconnect();
    }
  },5000);
}
function guestReconnect(){
  if(R2.reconnecting||R2.leaving||!R2.code)return;
  R2.reconnecting=true;
  R2.attempts++;
  if(R2.attempts>5){
    R2.reconnecting=false;
    setNet("off");
    toast("ホストに再接続できませんでした");
    var keepCode=R2.code;
    roomTeardown();
    go("roomSetup");
    try{$("#rsCode",app).value=keepCode;}catch(e){}
    return;
  }
  var delay=Math.min(800*R2.attempts,4000);
  var prevPid=R2.myPid;
  if(R2.peer){try{R2.peer.destroy();}catch(e){}R2.peer=null;R2.hostConn=null;}
  setTimeout(function(){
    if(R2.leaving)return;
    roomJoin(R2.code,{rejoin:true,prevPid:prevPid}).then(function(r){
      if(R2.leaving)return;
      if(r.error){
        if(r.errType==="peer-unavailable"&&canMigrate()){R2.reconnecting=false;hostMigration();return;}
        if(R2.attempts<=5){R2.reconnecting=false;guestReconnect();}
        return;
      }
      /* 接続成功: welcome/resume を待つ。失敗なら close ハンドラが再試行 */
    });
  },delay);
}

/* ---------- ホスト交代（ホストが消えたらメンバーがルームを引き継ぐ） ---------- */
function canMigrate(){
  return !!R2.code&&R2.order.length>1&&!!R2.players[R2.myPid]&&!R2.players[R2.myPid].left
    &&(R2.phase==="lobby"||R2.phase==="waiting-q"||R2.phase==="question"||R2.phase==="reveal");
}
function hostMigration(){ /* ホストのPeerが消えていたら自分が引き継ぎを試みる */
  if(R2.migrating||R2.leaving)return;
  if(!canMigrate()){
    if(R2.phase!=="end"&&!R2.saveDone)giveUpRoom();
    return;
  }
  R2.migrating=true;setNet("r");
  setTimeout(function(){tryClaimHost(0);},200+Math.floor(Math.random()*600));
}
function giveUpRoom(){
  R2.migrating=false;
  if(R2.phase==="end"||R2.saveDone)return;
  toast("ホストが見つからないためルームを退出しました");
  var keepCode=R2.code;
  roomTeardown();
  go("roomSetup");
  try{$("#rsCode",app).value=keepCode;}catch(e){}
}
function tryClaimHost(n){
  if(R2.leaving)return;
  if(n>=3)return giveUpRoom();
  var peer;
  try{peer=new Peer(PEER_PREFIX+R2.code,PEER_CONFIG);}catch(e){return giveUpRoom();}
  var settled=false;
  var to=setTimeout(function(){if(!settled){settled=true;try{peer.destroy();}catch(e){}tryClaimHost(n+1);}},9000);
  peer.on("error",function(e){
    if(settled)return;settled=true;clearTimeout(to);
    try{peer.destroy();}catch(e2){}
    if(e&&e.type==="unavailable-id"){ /* 他のメンバーが先に引き継いだ → そのホストへ参加し直す */
      R2.migrating=false;R2.attempts=0;R2.reconnecting=false;
      guestReconnect();return;
    }
    setTimeout(function(){if(!R2.leaving)tryClaimHost(n+1);},1200);
  });
  peer.on("open",function(){
    if(settled){try{peer.destroy();}catch(e){}return;}
    settled=true;clearTimeout(to);
    becomeHost(peer);
  });
}
function rebuildQuestion(e2,i){ /* 問題文から単語を引き当てて正解を復元 */
  var w=null;
  for(var k=0;k<WORDS.length;k++){
    if((e2.dir==="ej"?WORDS[k].e:WORDS[k].j)===e2.text){w=WORDS[k];break;}
  }
  var correct=e2.correct;
  if(correct==null&&w)correct=e2.options.indexOf(e2.dir==="ej"?w.j:w.e);
  if(correct==null||correct<0)correct=0;
  return {wid:w?w.id:null,dir:e2.dir,text:e2.text,options:e2.options,correct:correct,qi:i};
}
function genRoomQuestion(used){ /* 残りの問題を新しく生成 */
  var pool=R2.settings.lv==="mix"?WORDS:WORDS.filter(function(w){return String(w.lv)===String(R2.settings.lv);});
  var fresh=pool.filter(function(w){return !used[w.e]&&!used[w.j];});
  if(!fresh.length)fresh=pool;
  var w=fresh[Math.floor(Math.random()*fresh.length)];
  var dir=R2.settings.dir==="mix"?(Math.random()<.5?"ej":"je"):R2.settings.dir;
  var q=buildQuestion(w,dir);q.wid=w.id;
  return q;
}
function becomeHost(peer){
  R2.order.forEach(function(pid){var p=R2.players[pid];if(p)p.host=false;});
  var oldHost=R2.order[0];
  if(oldHost&&oldHost!==R2.myPid&&R2.players[oldHost])R2.players[oldHost].left=true;
  var meP=R2.players[R2.myPid];
  if(meP){meP.host=true;meP.left=false;}
  (R2.lastScores||[]).forEach(function(s){var p=R2.players[s.id];if(p&&s.points!=null)p.points=s.points;});
  R2.conns={};R2.seen={};R2.isHost=true;R2.leaving=false;R2.migrating=false;R2.reconnecting=false;
  R2.answered=false;R2.lastResults=null;R2.attempts=0;R2.hostConn=null;
  peer.on("connection",function(conn){wireHostConn(conn);});
  peer.on("error",function(){});
  R2.peer=peer;
  /* 過去問と全員の回答を履歴から復元 */
  R2.qlog.forEach(function(e2,i){
    if(!e2)return;
    var q=rebuildQuestion(e2,i);
    if(q)R2.qs[i]=q;
    (e2.results||[]).forEach(function(r){
      var p=R2.players[r.id];if(!p||!R2.qs[i])return;
      if(!p.answers)p.answers={};
      p.answers[i]={choice:-1,ok:!!r.ok,timeMs:r.timeMs||0,point:r.point||0,
        ans:r.ok?R2.qs[i].options[R2.qs[i].correct]:"（不明）"};
      if(r.total!=null)p.points=r.total;
    });
  });
  /* 今後の問題を生成 */
  var used={};R2.qs.forEach(function(q){if(q)used[q.text]=true;});
  for(var i=0;i<(R2.total||0);i++){
    if(R2.qs[i])continue;
    var gq=genRoomQuestion(used);gq.qi=i;R2.qs[i]=gq;used[gq.text]=true;
  }
  startHostLiveness();
  setNet("ok");
  toast("「"+meP.name+"」がホストを引き継ぎました");
  if(R2.phase==="lobby"){
    hostBroadcast({t:"lobby",players:lobbyPlayers(),settings:R2.settings,code:R2.code});
    go("roomLobby");
    return;
  }
  if(R2.qi<0)R2.qi=0;
  var cur=R2.qs[R2.qi];
  var res=cur&&R2.qlog[R2.qi]&&R2.qlog[R2.qi].results;
  if(R2.phase==="reveal"&&res){ /* 解答表示の途中だった → 表示して続きへ */
    R2.lastResults=res;
    R2.revealUntil=Date.now()+2500;
    hostBroadcast({t:"reveal",qi:R2.qi,correct:cur.correct,results:res});
    R2.view={type:"reveal",qi:R2.qi,total:R2.qs.length,q:{dir:cur.dir,text:cur.text,options:cur.options},correct:cur.correct,results:res,nextMs:2500,recvAt:Date.now(),canSkip:false};
    go("roomBattle");
    if(R2.t2)clearTimeout(R2.t2);
    R2.t2=setTimeout(hostAdvance,2500);
  }else{ /* 出題中だった → 同じ問題を全員に再送 */
    R2.phase="question";
    sendQuestion();
  }
}

/* ---------- 再戦（ホスト: 同じメンバーでもう一度） ---------- */
function hostRematch(){
  if(!R2.isHost||R2.phase!=="end"||!R2.peer)return;
  if(R2.tEnd){clearTimeout(R2.tEnd);R2.tEnd=null;}
  R2.order=R2.order.filter(function(pid){var p=R2.players[pid];return p&&!p.left;});
  R2.order.forEach(function(pid){var p=R2.players[pid];p.points=0;p.answers={};p.left=false;p.rank=0;});
  R2.saveDone=false;R2.lastEnd=null;R2.lastResults=null;R2.answered=false;R2.qlog=[];
  R2.qi=0;
  roomStartGame();
}

/* ---------- チャット（定型文・自由入力） ---------- */
var CHAT_TAUNTS=["おそっ！亀？","それ勉強した?","余裕ww","ざんね〜ん","追いつける?","かんたんすぎ✌","集中〜！","まだ回答してないの？"];
var CHAT_NICE=["よろしく！","ナイス！","いいね！","あと1問！"];
function chatPush(m){
  R2.chat.push(m);
  if(R2.chat.length>50)R2.chat.shift();
  if(!CHAT_OPEN)R2.chatUnread++;
  refreshChatLog();renderChatFab();
}
function chatBubble(m){
  return "<div class='cmsg"+(m.mine?" mine":"")+"'>"+
    (m.mine?"":"<small>"+esc(m.name)+"</small>")+
    "<div class='ctext'>"+esc(m.text)+"</div></div>";
}
function refreshChatLog(){
  var lg=document.querySelector("#chatLog");
  if(lg)lg.innerHTML=R2.chat.map(chatBubble).join("");
}
function canChat(){
  return !!R2.peer&&(R2.phase==="lobby"||R2.phase==="waiting-q"||R2.phase==="question"||R2.phase==="reveal"||R2.phase==="end");
}
function sendChat(text){
  if(!canChat())return;
  var t=String(text||"").trim().slice(0,80);if(!t)return;
  var now=Date.now();
  if(now-R2.chatLastSent<1200){toast("送信が早すぎます。少し待ってください");return;}
  R2.chatLastSent=now;
  if(R2.isHost)hostChatMsg(R2.myPid,me().name,t);
  else if(R2.hostConn){try{R2.hostConn.send({t:"chat",text:t});}catch(e){}}
}
function hostChatMsg(pid,name,text){
  if(!R2.isHost)return;
  var t=String(text||"").trim().slice(0,80);if(!t)return;
  var now=Date.now();
  if(now-(R2.chatRate[pid]||0)<800)return; /* 1人0.8秒以下の連投は無視 */
  R2.chatRate[pid]=now;
  R2.chatSeq++;
  hostBroadcast({t:"chat",id:R2.chatSeq,pid:pid,name:name,text:t});
  chatPush({pid:pid,name:name,text:t,mine:pid===R2.myPid});
}
function renderChatFab(){
  var el=document.querySelector("#chatFab");
  if(!canChat()){if(el)el.style.display="none";return;}
  if(!el){
    el=document.createElement("button");el.id="chatFab";el.title="チャット";
    el.onclick=function(){CHAT_OPEN?closeChatPanel():openChatPanel();};
    document.body.appendChild(el);
  }
  el.style.display="grid";
  el.innerHTML="💬"+(R2.chatUnread>0?"<span class='cbadge'>"+(R2.chatUnread>9?"9+":R2.chatUnread)+"</span>":"");
}
function openChatPanel(){
  closeChatPanel();

  var wrap=document.createElement("div");wrap.id="chatPanel";
  wrap.innerHTML="<div class='sheet'>"+
    "<div class='chead'><b>💬 チャット</b><button id='chatClose'>✕</button></div>"+
    "<div id='chatLog'>"+R2.chat.map(chatBubble).join("")+"</div>"+
    "<div class='chips'><span class='clbl'>煽り</span>"+
    CHAT_TAUNTS.map(function(t){return "<button class='chip hot'>"+t+"</button>";}).join("")+
    "<span class='clbl'>あいさつ</span>"+
    CHAT_NICE.map(function(t){return "<button class='chip'>"+t+"</button>";}).join("")+
    "</div>"+
    "<div class='crow'><input type='text' id='chatInput' maxlength='80' placeholder='自由入力（80文字まで）'><button class='btn pri' id='chatSend'>送信</button></div>"+
    "</div>";

  });

}

/* ---------- 公開ルーム（テンプレ部屋 HAFY1〜5） ---------- */
var TPL_ROOMS=["HAFY1","HAFY2","HAFY3","HAFY4","HAFY5"];
var __tplStatus={};
var probePeer=null,probeSeq=0;
function tplMark(code,m){ /* 表示を更新（_tplStatus はテスト用ミラー） */
  var s=$("#tpls-"+code);
  var t=(typeof m==="string")?m:null;
  if(t){__tplStatus[code]=t;if(s)s.textContent=t;return;}
  if(!m||m.n<=0||m.phase==="end"){__tplStatus[code]="空き";if(s)s.textContent="空き";return;}
  __tplStatus[code]=m.n+"人"+(m.phase==="lobby"?"（待機中）":"（対戦中）");
  if(s)s.textContent=__tplStatus[code];
}
function probeTemplateRooms(){ /* 公開ルームの人数をまとめて調査 */
  var seq=++probeSeq;
  if(probePeer){try{probePeer.destroy();}catch(e){}probePeer=null;}
  TPL_ROOMS.forEach(function(c){__tplStatus[c]="調査中…";var el=$("#tpls-"+c);if(el)el.textContent="調査中…";});
  if(typeof Peer==="undefined")return;
  var p;
  try{p=new Peer(PEER_CONFIG);}catch(e){return;}
  probePeer=p;
  p.on("open",function(){
    if(seq!==probeSeq){try{p.destroy();}catch(e){}return;}
    TPL_ROOMS.forEach(function(code){
      var conn;
      try{conn=p.connect(PEER_PREFIX+code,{reliable:true});}catch(e){return;}
      var to=setTimeout(function(){tplMark(code,"空き");try{conn.close();}catch(e){}},4500);
      conn.on("open",function(){try{conn.send({t:"count"});}catch(e){}});
      conn.on("data",function(m){if(m&&m.t==="count"){clearTimeout(to);tplMark(code,m);try{conn.close();}catch(e){}}});
      conn.on("error",function(){});
    });
  });
  p.on("error",function(e){
    if(e&&e.type==="peer-unavailable"){
      var mm=(e&&e.message)||"";
      TPL_ROOMS.forEach(function(code){if(!mm||mm.indexOf(code)>=0)tplMark(code,"空き");});
    }
  });
  setTimeout(function(){if(probePeer===p){try{p.destroy();}catch(e){}}},6000);
}
function templateEnter(code){ /* 空いていればホストになる、埋まっていれば参加 */
  var btn=$("#tpl-"+code);if(btn)btn.disabled=true;
  R2.settings={count:RSET.count,dir:RSET.dir,lv:"mix",limit:RSET.limit};
  roomCreateAt(code).then(function(r){
    if(r&&r.ok){go("roomLobby");return;}
    roomJoin(code,null).then(function(j){
      var btn2=$("#tpl-"+code);
      if(j.error){if(btn2)btn2.disabled=false;return toast(j.error);}
      go("roomLobby");
    });
  });
}

/* ---------- 回答送信 ---------- */
function roomAnswer(choice){
  if(R2.answered)return;
  R2.answered=true;
  $$("#rch .choice",app).forEach(function(x){x.disabled=true;x.style.opacity=.5;});
  if(R2.isHost)applyAnswer(R2.myPid,choice);
  else if(R2.hostConn){try{R2.hostConn.send({t:"answer",qi:R2.cur&&R2.cur.qi!=null?R2.cur.qi:0,choice:choice});}catch(e){}}
  updateWaitBox(R2.cur||{answered:R2.isHost?answeredCount():1,totalP:R2.isHost?activePlayers().length:(R2.order?R2.order.length:1),scores:R2.isHost?scoreSnapshot():[]});
}
function endRecordId(end){
  var s=end.code+"|"+end.date+"|"+R2.myPid;var h=0;
  for(var i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;
  return "b_"+(h>>>0).toString(36);
}
function saveRoomRecord(end){
  var m=me();if(!m)return;
  var mine=null;
  end.players.forEach(function(p){if(p.id===R2.myPid)mine=p;});
  if(!mine)return;
  var sameTop=end.players.filter(function(p){return p.rank===mine.rank;}).length;
  var res=mine.rank===1?(sameTop===1?"w":"d"):"l";
  var rid=endRecordId(end);
  var record={id:rid,roomId:"p2p-"+end.code,date:end.date,mode:"room",
    players:end.players.map(function(p){
      return {pid:p.id===R2.myPid?m.id:("p2p:"+p.name),name:p.name,isCpu:false,
        points:p.points,rank:p.rank,correct:p.correct,wrong:p.wrong,accuracy:p.accuracy,avgTimeMs:p.avgTimeMs};}),
    me:{points:mine.points,rank:mine.rank,res:res,correct:mine.correct,wrong:mine.wrong,accuracy:mine.accuracy,avgTimeMs:mine.avgTimeMs,count:end.total},
    questions:end.questions.map(function(q){
      var a=q.answers[R2.myPid]||{choice:-1,ok:false,timeMs:(R2.settings?R2.settings.limit:15)*1000,point:0,ans:"（未回答）"};
      return {wid:q.wid,dir:q.dir,ok:a.ok,timeMs:a.timeMs,point:a.point,ans:a.ans,
        correctText:q.options[q.correct],
        all:Object.keys(q.answers).map(function(pid){
          var pl=end.players.filter(function(x){return x.id===pid;})[0]||{name:"?"};
          return {pid:pid===R2.myPid?m.id:("p2p:"+pl.name),name:pl.name,isCpu:false,ok:q.answers[pid].ok,timeMs:q.answers[pid].timeMs};})};
    })};
  var dup=m.battles.some(function(b){return b.id===rid;});
  if(!dup){
    m.battles.push(record);
    m.lastAt=new Date().toISOString();
    record.questions.forEach(function(qd){recordAnswer(m,qd.wid,qd.dir,"battle",qd.ok,qd.timeMs);});
    saveDB();
  }
  if(!R2.isHost)roomTeardown(); /* ホストは再接続用にendを60秒保持 */
  go("battleResult",{bid:rid});
}

function updateWaitBox(wait){

function renderRoomReveal(){

/* ---------- グラフ（SVG自前実装） ---------- */
function chartLine(vals,labels,opts){
  opts=opts||{};var W=360,H=160,padL=40,padR=12,padT=14,padB=24;
  var n=vals.length;
  var max=opts.max!=null?opts.max:Math.max.apply(null,vals.concat([0]));
  var min=opts.min!=null?opts.min:0;
  if(max===min)max=min+1;
  var iw=W-padL-padR,ih=H-padT-padB;
  function X(i){return padL+(n<=1?iw/2:iw*i/Math.max(1,n-1));}
  function Y(v){return padT+ih*(1-(v-min)/(max-min));}
  var col=opts.color||"#6366f1";
  var s="<svg viewBox='0 0 "+W+" "+H+"' xmlns='http://www.w3.org/2000/svg'>";
  for(var g=0;g<=3;g++){var gy=padT+ih*g/3;var gv=max-(max-min)*g/3;
    s+="<line class='gline' x1='"+padL+"' y1='"+gy+"' x2='"+(W-padR)+"' y2='"+gy+"'/>";
    s+="<text class='axis' x='"+(padL-5)+"' y='"+(gy+3.5)+"' text-anchor='end'>"+Math.round(gv)+"</text>";}
  if(n>1)s+="<polyline class='poly' points='"+vals.map(function(v,i){return X(i)+","+Y(v);}).join(" ")+"' stroke='"+col+"'/>";
  vals.forEach(function(v,i){s+="<circle class='dot' cx='"+X(i)+"' cy='"+Y(v)+"' r='3.2' fill='"+col+"'/>";});
  var step=Math.max(1,Math.ceil(n/6));
  labels.forEach(function(l,i){if(i%step===0||i===n-1)s+="<text class='axis' x='"+X(i)+"' y='"+(H-7)+"' text-anchor='middle'>"+esc(l)+"</text>";});
  s+="</svg>";return s;
}
function chartBars(labels,vals,opts){
  opts=opts||{};var W=360,H=160,padL=40,padR=12,padT=14,padB=24;
  var n=vals.length;
  var max=Math.max.apply(null,vals.concat([1,opts.max||0]));
  var iw=W-padL-padR,ih=H-padT-padB;
  var bw=iw/n;
  var col=opts.color||"#ec4899";
  var s="<svg viewBox='0 0 "+W+" "+H+"' xmlns='http://www.w3.org/2000/svg'>";
  for(var g=0;g<=3;g++){var gy=padT+ih*g/3;var gv=max*(1-g/3);
    s+="<line class='gline' x1='"+padL+"' y1='"+gy+"' x2='"+(W-padR)+"' y2='"+gy+"'/>";
    s+="<text class='axis' x='"+(padL-5)+"' y='"+(gy+3.5)+"' text-anchor='end'>"+Math.round(gv)+"</text>";}
  vals.forEach(function(v,i){
    var bh=ih*(v/max);var x=padL+bw*i+bw*0.18;
    s+="<rect class='bar' x='"+x+"' y='"+(padT+ih-bh)+"' width='"+(bw*0.64)+"' height='"+Math.max(1,bh)+"' fill='"+col+"' opacity='"+(0.55+0.45*(v/max))+"'/>";
  });
  var step=Math.max(1,Math.ceil(n/8));
  labels.forEach(function(l,i){if(i%step===0||i===n-1)s+="<text class='axis' x='"+(padL+bw*i+bw/2)+"' y='"+(H-7)+"' text-anchor='middle'>"+esc(l)+"</text>";});
  s+="</svg>";return s;
}

    "<div class='sub' style='margin-top:8px'>"+(de.c>=dj.c?"英語→日本語の方が得意です":"日本語→英語の方が得意です")+"（"+"対戦成績ベース"+"）</div></div>";

/* ---------- 単語別統計 ---------- */
function aggFromHistory(st,mode){
  var a={wid:st.wid,asked:0,correct:0,wrong:0,sumTime:0,lastAt:"",dir:{ej:{a:0,c:0,t:0},je:{a:0,c:0,t:0}}};
  (st.history||[]).forEach(function(e){
    if(mode&&mode!=="all"&&e.mode!==mode)return;
    a.asked++;a.sumTime+=e.timeMs;
    if(e.ok)a.correct++;else a.wrong++;
    if(e.t>a.lastAt)a.lastAt=e.t;
    var d=a.dir[e.dir]||(a.dir[e.dir]={a:0,c:0,t:0});d.a++;d.t+=e.timeMs;if(e.ok)d.c++;
  });
  return a;
}

/* ---------- プレイヤー比較 ---------- */
function compList(m){
  var map={};
  (m.battles||[]).forEach(function(b){
    b.players.forEach(function(p){
      if(p.pid===m.id)return;
      var key=p.pid||("cpu:"+p.name);
      if(!map[key])map[key]={key:key,name:p.name,isCpu:p.isCpu,matches:0,w:0,l:0,d:0,myAcc:0,opAcc:0,bids:[]};
      var e=map[key];e.matches++;e.bids.push(b.id);
      if(b.me.rank<p.rank)e.w++;else if(b.me.rank>p.rank)e.l++;else e.d++;
      e.myAcc+=b.me.accuracy;e.opAcc+=p.accuracy;
    });
  });
  return Object.keys(map).map(function(k){var e=map[k];
    return {key:e.key,name:e.name,isCpu:e.isCpu,matches:e.matches,w:e.w,l:e.l,d:e.d,
      winRate:e.matches?e.w/e.matches:0,myAvgAcc:e.myAcc/e.matches,opAvgAcc:e.opAcc/e.matches,bids:e.bids};})
    .sort(function(a,b){return b.matches-a.matches;});
}
function wordsVs(m,oppKey){
  var strong={},weak={};
  (m.battles||[]).forEach(function(b){
    var inB=b.players.some(function(p){return (p.pid||("cpu:"+p.name))===oppKey;});
    if(!inB)return;
    b.questions.forEach(function(q){
      var op=q.all.filter(function(a){return (a.pid||("cpu:"+a.name))===oppKey;})[0];
      if(!op)return;
      if(q.ok&&!op.ok)strong[q.wid]=(strong[q.wid]||0)+1;
      if(!q.ok&&op.ok)weak[q.wid]=(weak[q.wid]||0)+1;
    });
  });
  function top(o){return Object.keys(o).map(function(w){return {wid:w,n:o[w]};}).sort(function(a,b){return b.n-a.n;}).slice(0,8);}
  return {strong:top(strong),weak:top(weak)};
}

  var html="<div class='card'><h2>🆚 プレイヤー比較</h2><p class='sub'>同じルームで対戦した相手との通算成績です。</p>";

  list.forEach(function(o){
    var oppLabel=o.isCpu?"🤖 "+esc(o.name):esc(o.name);

      "<div class='grid3'>"+
      "<div class='stat'><div class='v'>"+o.matches+"<small> 回</small></div><div class='k'>通算対戦</div></div>"+
      "<div class='stat'><div class='v' style='color:var(--ok)'>"+o.w+"<small> 勝</small></div><div class='k'>勝ち</div></div>"+
      "<div class='stat'><div class='v' style='color:var(--ng)'>"+o.l+"<small> 負</small></div><div class='k'>負け</div></div>"+
      "<div class='stat'><div class='v'>"+o.d+"<small> 分</small></div><div class='k'>引き分け</div></div>"+
      "<div class='stat'><div class='k'>自分の平均正答率</div><div class='v'>"+pctf(o.myAvgAcc)+"</div><div class='meter acc' style='margin-top:5px'><i style='width:"+(o.myAvgAcc*100)+"%'></i></div></div>"+
      "<div class='stat'><div class='k'>相手の平均正答率</div><div class='v'>"+pctf(o.opAvgAcc)+"</div><div class='meter acc' style='margin-top:5px'><i style='width:"+(o.opAvgAcc*100)+"%'></i></div></div></div>"+
      "<div class='rowbtns mt'><button class='btn sm ghost' data-exp='"+esc(o.key)+"'>得意・苦手の比較を見る</button></div>"+
      "<div data-cmp='"+esc(o.key)+"' style='display:none'></div></div>";
  });
  el.innerHTML=html;
  $$("[data-exp]",el).forEach(function(b){
    b.onclick=function(){
      var key=b.getAttribute("data-exp");
      var box=el.querySelector("[data-cmp='"+key.replace(/"/g,'\\"')+"']");
      if(!box)return;
      if(box.style.display!=="none"){box.style.display="none";b.textContent="得意・苦手の比較を見る";return;}
      var v=wordsVs(m,key);
      function wl(items,cls){return items.length?items.map(function(x){var w=WORD_BY[x.wid];
        return "<span class='badge "+cls+"'>"+esc(w.e)+"（"+esc(w.j)+"）×"+x.n+"</span>";}).join(" "):"<span class='sub'>—</span>";}
      box.innerHTML="<div style='margin-top:10px'><h3>💪 自分の得意単語 <small>（自分○/相手✗）</small></h3><div class='klist'>"+wl(v.strong,"b-ok")+"</div>"+
        "<h3>😵 自分の苦手単語 <small>（自分✗/相手○）</small></h3><div class='klist'>"+wl(v.weak,"b-ng")+"</div></div>";
      box.style.display="block";b.textContent="閉じる";
    };
  });
}

/* ---------- 対戦履歴 ---------- */
function historyItemHtml(b){
  var resB=b.me.res==="w"?"b-ok":b.me.res==="d"?"b-warn":"b-ng";
  var resT=b.me.res==="w"?"勝利":b.me.res==="d"?"引き分け":"敗北";
  return "<button class='mi' data-bid='"+b.id+"'><span class='ic'>🌐</span>"+
    "<span class='tx'>"+dtf(b.date)+"<small>"+b.players.map(function(p){return esc(p.name);}).join(" ・ ")+"</small></span>"+
    "<span class='badge "+resB+"'>"+resT+" "+b.me.rank+"位</span><span class='arr'>▶</span></button>";
}
function wireHistoryItems(el){
  $$("[data-bid]",el).forEach(function(b){b.onclick=function(){go("battleDetail",{id:b.getAttribute("data-bid")});};});
}
SCREENS.history=function(){
  var m=me();if(!m)return go("profiles");
  var bs=(m.battles||[]).slice().sort(function(a,b){return a.date<b.date?1:-1;});
  var html="<div class='card'><h2>📜 対戦履歴<small class='sub' style='font-weight:600'>（"+bs.length+"件）</small></h2>";
  if(!bs.length)html+="<div class='empty'><span class='big'>📜</span>まだ対戦記録がありません</div>";
  bs.forEach(function(b){html+=historyItemHtml(b);});
  html+="</div><div class='rowbtns'><button class='btn ghost block' id='hBack'>ホームへ</button></div>";
  app.innerHTML=html;
  wireHistoryItems(app);
  $("#hBack",app).onclick=function(){go("home");};
};
SCREENS.battleDetail=function(params){
  var m=me();if(!m)return go("profiles");
  var b=null;(m.battles||[]).forEach(function(x){if(x.id===params.id)b=x;});
  if(!b)return go("history");
  var resB=b.me.res==="w"?"b-ok":b.me.res==="d"?"b-warn":"b-ng";
  var html="<div class='card'><h2>📜 対戦詳細</h2><div class='sub'>"+dtf(b.date)+" ・ ルーム対戦 ・ ルーム "+esc(String(b.roomId).replace("room-",""))+" ・ "+b.questions.length+"問</div>"+
    "<div class='grid3 mt'>"+
    "<div class='stat hi'><div class='v'><span class='badge "+resB+"' style='font-size:13px'>"+(b.me.res==="w"?"勝利":b.me.res==="d"?"引き分け":"敗北")+"</span></div><div class='k'>結果（"+b.me.rank+"位）</div></div>"+
    "<div class='stat'><div class='v'>"+b.me.points+"<small> pt</small></div><div class='k'>獲得ポイント</div></div>"+
    "<div class='stat'><div class='v'>"+pctf(b.me.accuracy)+"</div><div class='k'>正答率</div></div>"+
    "<div class='stat'><div class='v'>"+b.me.correct+"<small> 問</small></div><div class='k'>正解数</div></div>"+
    "<div class='stat'><div class='v'>"+b.me.wrong+"<small> 問</small></div><div class='k'>誤答数</div></div>"+
    "<div class='stat'><div class='v'>"+secf(b.me.avgTimeMs)+"</div><div class='k'>平均回答時間</div></div></div>"+
    "<h3>最終順位</h3>";
  b.players.slice().sort(function(a,c){return a.rank-c.rank||c.points-a.points;}).forEach(function(p){
    html+="<div class='rk "+(p.pid===m.id?"me":"")+"'>"+(p.isCpu?"<span class='no'>🤖</span>":avatarHtml(p.pid,p.name))+
      "<div class='nm'>"+esc(p.name)+"<small>"+p.rank+"位 ・ 正解 "+p.correct+"/"+b.questions.length+" ・ "+pctf(p.accuracy)+" ・ "+secf(p.avgTimeMs)+"</small></div>"+
      "<div class='pt'><b>"+p.points+"</b><small>pt</small></div></div>";
  });
  html+="</div><div class='card'><h2>📝 各問題の回答結果</h2><div class='tscroll'><table class='tbl'><tr><th>#</th><th>単語</th><th>方向</th><th>あなたの回答</th><th>正解</th><th class='c'>正誤</th><th class='num'>時間</th><th class='num'>pt</th><th>全員</th></tr>";
  b.questions.forEach(function(q,i){
    var w=WORD_BY[q.wid];
    var all=q.all.map(function(a){return (a.isCpu?"🤖":"")+(a.ok?"○":"✗");}).join(" ");
    html+="<tr><td>"+(i+1)+"</td><td><b>"+esc(q.dir==="ej"?w.e:w.j)+"</b><small style='display:block;color:var(--sub)'>"+esc(q.dir==="ej"?w.j:w.e)+"</small></td>"+
      "<td style='white-space:nowrap;font-size:11.5px'>"+dirName(q.dir)+"</td><td style='font-size:12px'>"+esc(q.ans)+"</td><td style='font-size:12px'>"+esc(q.correctText)+"</td>"+
      "<td class='c'><span class='badge "+(q.ok?"b-ok":"b-ng")+"'>"+(q.ok?"○":"✗")+"</span></td>"+
      "<td class='num'>"+secf(q.timeMs)+"</td><td class='num'>"+q.point+"</td><td style='white-space:nowrap;font-size:11.5px'>"+esc(all)+"</td></tr>";
  });
  html+="</table></div></div><div class='rowbtns'><button class='btn ghost' id='bdBack' style='flex:1'>履歴へ戻る</button></div>";
  app.innerHTML=html;
  $("#bdBack",app).onclick=function(){go("history");};
};
/* ================= プロフィール（名前変更は7日に1回・端末内保存） ================= */
SCREENS.account=function(){
  var m=me();if(!m)return go("profiles");
  var elapsed=Date.now()-new Date(m.nameChangedAt||m.createdAt).getTime();
  var canRename=elapsed>=NAME_CHANGE_MS();
  var nextDay=dstr(new Date(new Date(m.nameChangedAt||m.createdAt).getTime()+NAME_CHANGE_MS()).toISOString());
  var html="<div class='card'><h2>👤 プロフィール</h2>"+
    "<div class='center'>"+avatarHtml(m.id,m.name,"big")+"<b style='font-size:17px'>"+esc(m.name)+"</b>"+
    "<div class='sub'>登録: "+dstr(m.createdAt)+" ・ 対戦 "+(m.battles||[]).length+"回</div>"+
    "<div class='sub'>🔒 記録はこの端末に保存されています</div></div>"+
    "<label class='f'>ユーザー名"+(canRename?"（変更できます）":"（次の変更は "+nextDay+" 以降）")+"</label>"+
    "<input type='text' id='acName' maxlength='12' value='"+esc(m.name)+"'"+(canRename?"":" disabled")+">"+
    "<label class='f'>アイコン色</label><div class='seg' id='acColor'>"+COLORS.map(function(c){return "<button data-v='"+c+"' style='"+(m.color===c?"border-color:"+c+";background:"+c+"22":"")+"'><span style='display:inline-block;width:18px;height:18px;border-radius:50%;background:"+c+"'></span></button>";}).join("")+"</div>"+
    "<button class='btn pri block mt' id='acSave'>保存する</button>"+
    "<hr class='divh'><div class='rowbtns'><button class='btn danger' id='acReset' style='flex:1'>🗑 戦績・統計をリセット</button></div>"+
    "<div class='sub' style='margin-top:6px'>この端末に保存された対戦履歴・単語別統計を全消去します（元に戻せません）。</div>"+
    "<hr class='divh'><div class='rowbtns'><button class='btn danger' id='acDel' style='flex:1'>"+(m.guest?"⚠ ゲストセッションを終了":"⚠ この端末からアカウントを削除")+"</button></div>"+
    "</div><div class='rowbtns'><button class='btn ghost block' id='acBack'>ホームへ</button></div>";
  app.innerHTML=html;
  var newColor=m.color;
  $$("#acColor button",app).forEach(function(b){b.onclick=function(){newColor=b.getAttribute("data-v");$$("#acColor button",app).forEach(function(x){x.style.background=x===b?newColor+"22":"";x.style.borderColor=x===b?newColor:"";});};});
  $("#acBack",app).onclick=function(){go("home");};
  $("#acSave",app).onclick=function(){
    var newName=$("#acName",app).value.trim();
    var before=m.name;
    var r=tryRename(m,newName);
    if(r.error)return toast(r.error);
    m.color=newColor;saveDB();
    var renamed=m.name!==before;
    toast(renamed?"名前を「"+m.name+"」に変更しました（次の変更は7日後から）":"保存しました");go("account");
  };
  $("#acReset",app).onclick=function(){
    confirmModal("戦績・統計のリセット",""+esc(m.name)+"の対戦履歴・単語別統計を全て削除します。よろしいですか？","リセットする",function(){
      m.battles=[];m.wordStats={};saveDB();toast("リセットしました");go("account");
    },true);
  };
  $("#acDel",app).onclick=function(){
    confirmModal(m.guest?"ゲストセッションの終了":"アカウントの削除","この端末から「"+m.name+"」の記録を削除します。よろしいですか？","削除する",function(){
      if(m.guest)DB.deviceAccount=null;
      delete DB.profiles[m.id];
      DB.deviceAccount=null;saveDB();
      SESSION=null;saveSession();
      toast("削除しました");go("profiles");
    },true);
  };
};

/* ================= アプリ起動（全定義の読み込み後に実行） ================= */
boot();
</script>
